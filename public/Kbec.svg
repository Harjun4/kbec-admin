<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Gaya untuk sudut garisan yang kemas -->
    <style>
      .chevron-blue {
        fill: none;
        stroke: #007BFF;
        stroke-width: 24;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
      }
      .chevron-red {
        fill: none;
        stroke: #FF0000;
        stroke-width: 32;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
      }
      .letter-k {
        fill: #007BFF;
      }
    </style>
  </defs>

  <g id="Logo">
    <!-- Chevron biru kecil di sebelah kiri -->
    <path class="chevron-blue" d="M 180 140 L 40 235 L 180 330" />

    <!-- Chevron merah (atas & bawah) -->
    <path class="chevron-red" d="M 175 60 L 305 150 L 175 220" />
    <path class="chevron-red" d="M 175 250 L 305 320 L 175 410" />

    <!-- Huruf K tebal geometri -->
    <path class="letter-k" d="
      M 400 45 
      L 520 45 
      L 520 185 
      L 630 45 
      L 775 45 
      L 615 225 
      L 780 425 
      L 630 425 
      L 520 270 
      L 520 425 
      L 400 425 
      Z
    " />
  </g>
</svg>
