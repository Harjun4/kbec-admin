<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KBEC Course Management Admin System">
    <title>KBEC Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .gradient-bg {
            background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 100%);
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(10, 88, 202, 0.4);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 16px rgba(10, 88, 202, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(10, 88, 202, 0);
            }
        }

        .animate-ring {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>

<body class="gradient-bg min-h-screen flex flex-col items-center justify-center p-4 antialiased text-white">

    <div class="text-center space-y-8 max-w-md w-full">
        <!-- Logo & Icon -->
        <div class="relative flex justify-center">
            <div class="w-24 h-24 bg-[#0A58CA]/10 border border-[#0A58CA]/30 rounded-3xl flex items-center justify-center animate-ring">
                <i data-lucide="graduation-cap" class="w-12 h-12 text-[#3B82F6]"></i>
            </div>
        </div>

        <!-- Text Title -->
        <div class="space-y-3">
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
                KBEC Admin Portal
            </h1>
            <p class="text-sm text-slate-400 font-medium">
                Kampung Bahasa English Course Management System
            </p>
        </div>

        <!-- Loading Spinner and Info -->
        <div class="flex flex-col items-center gap-3">
            <div class="flex items-center gap-2 text-xs font-semibold text-blue-400 bg-blue-500/10 px-3.5 py-1.5 rounded-full border border-blue-500/20">
                <!-- Mini Spinner -->
                <svg class="animate-spin h-3.5 w-3.5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Mengarahkan Anda ke halaman masuk...</span>
            </div>
        </div>

        <!-- Button Proceed (Just in case) -->
        <div>
            <a href="login.html" 
               class="inline-flex items-center gap-2 text-xs font-bold text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 px-5 py-2.5 rounded-xl shadow-lg transition-all duration-300">
                <span>Masuk Sekarang</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </a>
        </div>
    </div>

    <!-- Script Redirect -->
    <script>
        lucide.createIcons();

        // Redirect otomatis ke login.html setelah 1.5 detik
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);
    </script>
</body>

</html>
